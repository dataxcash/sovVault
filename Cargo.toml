[package]
name = "sov-vault"
version = "0.1.0"
edition = "2021"
description = "铁幕·带外零信任主权平台 - 存储中枢 (sovVault)"
license = "Apache-2.0"

[[bin]]
name = "sovvault"
path = "src/main.rs"

[lib]
name = "sov_vault"
path = "src/lib.rs"

[dependencies]
# 工作区依赖（版本与 e2e-tools / slimSync 锁文件对齐）
sov-probe = { path = "../sovProbe/sovProbe" }
slim-common = { path = "../slimRAG/slim-common" }

# 索引平面：LMDB（heed 0.22，与 slimRAG 锁文件对齐）
heed = "0.22.1"
# 管理平面：SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
# 传输解密（与 slimSync/e2e-tools 锁文件对齐 0.10）
chacha20poly1305 = "0.10"
# 在线 ingest：Zenoh 订阅（与 e2e-tools 锁文件对齐 1.9.0）+ tokio 运行时
zenoh = "1.9.0"
tokio = { version = "1", features = ["full"] }
# 十六进制密钥
hex = "0.4"
# CLI 与配置
clap = { version = "4.6", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误与日志
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 字节工具（大端键值编解码）
byteorder = "1"
# P5 PCAP 司法级导出（版本与 sov-probe 锁文件对齐 2.0.0）
pcap-file = "2"

[features]
default = []
parquet-export = []

[dev-dependencies]
# P5 E2E 压测 MD5 对账（纯 Rust、零运行时依赖）
md5 = "0.8.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = ["."]
